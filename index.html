<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Lamturo WebGIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body,#map{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* =========================
   LOGO KIRI ATAS
========================= */
#head{
    position:absolute;
    z-index:2000;
    left:14px;
    top:14px;
    background:#fff;
    padding:6px 12px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#12345a;
}

#head img{
    width:280px;
    max-width:100%;
    height:auto;
    max-height:80px;
    object-fit:contain;
    display:block;
}

/* =========================
   CONTROL / PANEL UI (DESAIN BARU)
========================= */
#ctl{
    position:absolute;
    z-index:2000;
    right:14px;
    top:14px;
    width:230px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
}

/* Kartu Tombol Utama & Card */
.btn-block, .p-card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    border: none;
    outline: none;
    transition: all 0.2s ease;
}

.btn-block {
    width: 100%;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 13px;
    color: #12345a;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.btn-block:hover {
    background: #f8fafc;
    transform: translateY(-1px);
}

.btn-block .arrow {
    font-size: 14px;
    color: #12345a;
}

/* Dropdown Accordion */
.p-card {
    overflow: hidden;
}

.p-header {
    width: 100%;
    padding: 11px 14px;
    background: #fff;
    border: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
    color: #12345a;
    cursor: pointer;
    text-align: left;
}

.p-header svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #12345a;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.p-header .caret {
    margin-left: auto;
    font-size: 10px;
    transition: transform 0.2s;
}

.p-card.open .p-header .caret {
    transform: rotate(180deg);
}

.p-content {
    display: none;
    padding: 10px 14px 12px 14px;
    border-top: 1px solid #f0f0f0;
    background: #fff;
}

.p-card.open .p-content {
    display: block;
}

/* Section Sub-header */
.sub-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: #888;
    margin-top: 10px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sub-header .badge {
    background: #eef2f6;
    color: #64748b;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
}

/* Checkbox Row Styling */
.r {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    font-size: 12px;
    color: #334155;
    cursor: pointer;
    font-weight: 500;
}

.r input[type="checkbox"] {
    accent-color: #0066ff;
    width: 15px;
    height: 15px;
    cursor: pointer;
}

/* Symbols */
.ln { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
.ln.src { background: #ff0000; }
.ln.rec { background: #0066ff; }

.pt { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pt.sp { background: #ff0000; }
.pt.tr { background: #0066ff; }

.lbl-icon { font-size: 10px; font-weight: 800; color: #333; line-height: 1; }

.block-title-header {
    font-size: 14px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    margin-bottom: 2px;
    padding-left: 2px;
    text-transform: uppercase;
}

/* Tombol Back */
.btn-back {
    background: #fff;
    color: #12345a;
    font-weight: 700;
    justify-content: flex-start;
    gap: 8px;
}

.btn-back svg {
    width: 16px;
    height: 16px;
    stroke: #12345a;
    stroke-width: 2.5;
}

/* Basemap List */
.b {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 4px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.b:hover { background: #edf2f7; }

/* Hazard List Scroll */
.hazard-c { max-height: 45vh; overflow-y: auto; }

/* =========================
   STATUS BAR
========================= */
#status{
    position:absolute;
    z-index:2000;
    right:14px;
    bottom:28px;
    background:rgba(255,255,255,0.92);
    padding:6px 10px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    font-size:10px;
    color:#555;
    text-align:right;
    pointer-events:none;
}
#coords{ font-weight:bold; color:#12345a; font-family:monospace; }

/* =========================
   POPUP & LABELS
========================= */
.at{ border-collapse:collapse; font-size:12px; }
.at td{ padding:4px; border-bottom:1px solid #ddd; }
.at td:first-child{ font-weight:bold; color:#555; }
.leaflet-popup-content{ max-height:300px; overflow:auto; }

.point-label{
    background:#fff; border:1px solid currentColor; border-radius:3px;
    padding:1px 3px; font-size:9px; font-weight:bold; white-space:nowrap;
    pointer-events:none; display:inline-block;
}
.point-label.spLabel{color:red;}
.point-label.trLabel{color:#06f;}

.receiver-label{
    background:#fff; border:1px solid #003f9e; border-radius:3px;
    color:#003f9e; padding:2px 4px; font-size:10px; font-weight:bold; white-space:nowrap;
}

.per100-label{
    color:#fff !important; font-size:12px; font-weight:bold; white-space:nowrap; pointer-events:none;
}

.red-location-icon { font-size: 26px; text-align: center; }

@media(max-width:600px){
    #ctl{ width:180px; right:8px; top:8px; }
    #head{ left:8px; top:8px; padding:4px 8px; }
    #head img{ width:160px; }
}
</style>
</head>

<body>

<div id="head">
    <img src="logo.png" alt="HAZARD MAP 2D LAMTURO PROJECT" onerror="this.onerror=null; this.parentElement.innerHTML='<b>2D LAMTURO PROJECT</b>';">
</div>

<div id="map"></div>

<!-- CONTAINER CONTROL (UX NAVIGATION) -->
<div id="ctl">

    <!-- STEP 1: BLOCK SELECTOR -->
    <div id="viewBlockSelect" style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn-block" onclick="selectBlock('east')">
            EAST BLOCK <span class="arrow">&rsaquo;</span>
        </button>
        <button class="btn-block" onclick="selectBlock('central')">
            CENTRAL BLOCK <span class="arrow">&rsaquo;</span>
        </button>
        <button class="btn-block" onclick="selectBlock('west')">
            WEST BLOCK <span class="arrow">&rsaquo;</span>
        </button>
        
        <!-- BASEMAP BUTTON UTAMA -->
        <div class="p-card">
            <button class="p-header" onclick="toggleAccordion(this)">
                🗺️ BASEMAP <span class="caret">▼</span>
            </button>
            <div class="p-content">
                <button class="b" onclick="base('sat')">🛰️ Satellite</button>
                <button class="b" onclick="base('hyb')">🌍 Hybrid</button>
                <button class="b" onclick="base('road')">🗺️ OpenStreetMap</button>
                <button class="b" onclick="base('street')">🏙️ Esri Street</button>
                <button class="b" onclick="base('topo')">⛰️ Topographic</button>
            </div>
        </div>

        <button class="btn-block" onclick="locate()">
            📍 MY LOCATION
        </button>
    </div>

    <!-- STEP 2: ACTIVE BLOCK LAYERS -->
    <div id="viewBlockLayers" style="display: none; flex-direction: column; gap: 8px;">
        
        <div id="blockTitle" class="block-title-header">EAST BLOCK</div>

        <!-- SURVEY LINE & POINTS -->
        <div class="p-card open">
            <button class="p-header" onclick="toggleAccordion(this)">
                <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
                SURVEY LINE <span class="caret">▼</span>
            </button>
            <div class="p-content">
                <label class="r">
                    <input id="srcOn" type="checkbox" checked onchange="toggleLines()">
                    <span class="ln src"></span> Source Line
                </label>
                <label class="r">
                    <input id="recOn" type="checkbox" checked onchange="toggleLines()">
                    <span class="ln rec"></span> Receiver Line
                </label>
                <label class="r">
                    <input id="lblOn" type="checkbox" checked onchange="updatePer100Labels()">
                    <span class="lbl-icon">123</span> Station Labels
                </label>

                <div class="sub-header">
                    POINT DATA <span class="badge">ZOOM 15+</span>
                </div>

                <label class="r">
                    <input id="spOn" type="checkbox" checked onchange="refreshPoints()">
                    <span class="pt sp"></span> Source Point
                </label>
                <label class="r">
                    <input id="trOn" type="checkbox" checked onchange="refreshPoints()">
                    <span class="pt tr"></span> Receiver Point
                </label>
            </div>
        </div>

        <!-- HAZARD -->
        <div class="p-card">
            <button class="p-header" onclick="toggleAccordion(this)">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                HAZARD <span class="caret">▼</span>
            </button>
            <div class="p-content hazard-c">
                <label class="r"><input id="hazardSungaiRawa" type="checkbox" onchange="toggleHazard('sungaiRawa')"> 🌊 Sungai / Rawa</label>
                <label class="r"><input id="hazardPotensiBanjir" type="checkbox" onchange="toggleHazard('potensiBanjir')"> 🌧️ Potensi Banjir</label>
                <label class="r"><input id="hazardPohonLapuk" type="checkbox" onchange="toggleHazard('pohonLapuk')"> 🌳 Pohon Lapuk</label>
                <label class="r"><input id="hazardLainnya" type="checkbox" onchange="toggleHazard('lainnya')"> ⚠️ Lainnya</label>
                <label class="r"><input id="hazardBinatangBerbahaya" type="checkbox" onchange="toggleHazard('binatangBerbahaya')"> 🐍 Binatang Berbahaya</label>
            </div>
        </div>

        <!-- TOMBOL BACK -->
        <button class="btn-block btn-back" onclick="backToBlockSelect()">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back
        </button>

    </div>

</div>

<div id="status">
    <div id="statusText">Pilih Blok...</div>
    <div id="coords">Lat: - | Lng: -</div>
</div>

<script>
/* =========================================================
   SETTINGS & VARIABLES
========================================================= */
const GRID_DEG = 0.1;
const POINT_MIN_ZOOM = 15;
const LABEL_MIN_ZOOM = 17;
const RECEIVER_LABEL_MAX_ZOOM = 16;
const MAX_ZOOM = 22;

let map;
let activeBlock = null; // 'east', 'central', atau 'west'

let srcGroup, recGroup;
let spL, trL;
let spLabels, trLabels;
let receiverLabels;
let per100OddLabels, per100EvenLabels;
let hazardLayers = {};
let myLocationMarker = null;

const hazardConfig = {
    sungaiRawa:{ checkbox:'hazardSungaiRawa', file:'Sungai atau Rawa.geojson', name:'Sungai / Rawa' },
    potensiBanjir:{ checkbox:'hazardPotensiBanjir', file:'Potensi Banjir.geojson', name:'Potensi Banjir' },
    pohonLapuk:{ checkbox:'hazardPohonLapuk', file:'Pohon Lapuk.geojson', name:'Pohon Lapuk' },
    lainnya:{ checkbox:'hazardLainnya', file:'Lainnya.geojson', name:'Lainnya' },
    binatangBerbahaya:{ checkbox:'hazardBinatangBerbahaya', file:'Binatang Berbahaya.geojson', name:'Binatang Berbahaya' }
};

let sat, hyb, road, street, topo;
let refreshSerial = 0;

/* Cache data per block */
let loadedData = {
    east: { src: null, rec: null, sp: null, tr: null, spIndex: new Map(), trIndex: new Map() },
    central: { src: null, rec: null, sp: null, tr: null, spIndex: new Map(), trIndex: new Map() },
    west: { src: null, rec: null, sp: null, tr: null, spIndex: new Map(), trIndex: new Map() }
};

/* =========================================================
   INIT MAP
========================================================= */
function init(){
    map = L.map('map',{ zoomControl:false, maxZoom:MAX_ZOOM, preferCanvas:true }).setView([-7.2,112.4], 10);

    L.control.zoom({ position:'bottomleft' }).addTo(map);

    map.on('mousemove', function(e) {
        document.getElementById('coords').textContent = `Lat: ${e.latlng.lat.toFixed(6)} | Lng: ${e.latlng.lng.toFixed(6)}`;
    });

    /* PANES */
    map.createPane('receiverPane').style.zIndex = 410;
    map.createPane('sourcePane').style.zIndex = 430;
    map.createPane('pointPane').style.zIndex = 450;
    map.createPane('receiverLabelPane').style.zIndex = 480;
    map.createPane('labelPane').style.zIndex = 500;
    map.createPane('hazardPane').style.zIndex = 520;

    /* BASEMAPS */
    sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:MAX_ZOOM, attribution:'Esri' }).addTo(map);
    road = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:MAX_ZOOM });
    street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:MAX_ZOOM });
    topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom:MAX_ZOOM });
    hyb = L.layerGroup([sat, L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { opacity:.25, maxZoom:MAX_ZOOM })]);

    /* LAYERS */
    srcGroup = L.layerGroup().addTo(map);
    recGroup = L.layerGroup().addTo(map);

    spL = L.layerGroup();
    trL = L.layerGroup();
    spLabels = L.layerGroup();
    trLabels = L.layerGroup();
    receiverLabels = L.layerGroup();
    per100OddLabels = L.layerGroup();
    per100EvenLabels = L.layerGroup();

    Object.keys(hazardConfig).forEach(key => hazardLayers[key] = L.layerGroup());

    loadPer100Labels();

    map.on('moveend zoomend', function(){
        clearTimeout(window._refreshTimer);
        window._refreshTimer = setTimeout(function(){
            if(activeBlock) {
                refreshPoints();
                updateReceiverLabels();
                updatePer100Labels();
            }
        }, 150);
    });

    updateStatus();
}

/* =========================================================
   NAVIGATION / BLOCK SELECTION LOGIC
========================================================= */
function selectBlock(blockKey) {
    activeBlock = blockKey;
    document.getElementById('viewBlockSelect').style.display = 'none';
    document.getElementById('viewBlockLayers').style.display = 'flex';
    document.getElementById('blockTitle').textContent = blockKey.toUpperCase() + ' BLOCK';

    loadBlockData(blockKey);
}

function backToBlockSelect() {
    activeBlock = null;
    document.getElementById('viewBlockLayers').style.display = 'none';
    document.getElementById('viewBlockSelect').style.display = 'flex';
    
    // Clear Active Layers
    srcGroup.clearLayers();
    recGroup.clearLayers();
    clearPointLayers();
    receiverLabels.clearLayers();
    
    updateStatus();
}

function toggleAccordion(btn) {
    const card = btn.parentElement;
    card.classList.toggle('open');
}

/* =========================================================
   DATA LOADING PER BLOCK
========================================================= */
async function loadBlockData(blockKey) {
    document.getElementById('statusText').textContent = `Memuat data ${blockKey.toUpperCase()}...`;
    
    srcGroup.clearLayers();
    recGroup.clearLayers();

    const blk = loadedData[blockKey];

    // 1. Line Source
    if (!blk.src) {
        try {
            const r = await fetch(`${blockKey}_source_line.geojson?v=6`);
            if(r.ok) blk.src = await r.json();
        } catch(e){ console.warn(e); }
    }
    if (blk.src && document.getElementById('srcOn').checked) {
        L.geoJSON(blk.src, { pane:'sourcePane', style:{ color:'#FF0000', weight:2.2, opacity:.95 }, onEachFeature:linePopup }).addTo(srcGroup);
    }

    // 2. Line Receiver
    if (!blk.rec) {
        try {
            const r = await fetch(`${blockKey}_receiver_line.geojson?v=6`);
            if(r.ok) blk.rec = await r.json();
        } catch(e){ console.warn(e); }
    }
    if (blk.rec && document.getElementById('recOn').checked) {
        L.geoJSON(blk.rec, { pane:'receiverPane', style:{ color:'#003f9e', weight:1.7, opacity:.95 }, onEachFeature:linePopup }).addTo(recGroup);
    }

    // Zoom Fit Bounds jika data line ditemukan
    if(blk.src || blk.rec) {
        const tempGeo = L.geoJSON(blk.src || blk.rec);
        map.fitBounds(tempGeo.getBounds(), { padding: [50, 50] });
    }

    updateReceiverLabels();
    refreshPoints();
}

/* Indexing SP/TRAS Points */
function cellKey(lng,lat){
    return `${Math.floor(Number(lng) / GRID_DEG)}/${Math.floor(Number(lat) / GRID_DEG)}`;
}

function buildPointIndex(data, index){
    index.clear();
    (data.features || []).forEach(f=>{
        if(!f.geometry || f.geometry.type !== 'Point') return;
        const [lng, lat] = f.geometry.coordinates || [];
        if(!Number.isFinite(lng) || !Number.isFinite(lat)) return;
        const key = cellKey(lng,lat);
        if(!index.has(key)) index.set(key,[]);
        index.get(key).push(f);
    });
}

async function refreshPoints(){
    if (!activeBlock) return;
    
    const serial = ++refreshSerial;
    updateStatus();
    clearPointLayers();

    if(map.getZoom() < POINT_MIN_ZOOM){
        map.removeLayer(spL); map.removeLayer(trL);
        map.removeLayer(spLabels); map.removeLayer(trLabels);
        return;
    }

    const blk = loadedData[activeBlock];

    if (!blk.sp) {
        try {
            const r = await fetch(`${activeBlock}_sp.geojson?v=6`);
            if(r.ok) { blk.sp = await r.json(); buildPointIndex(blk.sp, blk.spIndex); }
        } catch(e){}
    }
    if (!blk.tr) {
        try {
            const r = await fetch(`${activeBlock}_tras.geojson?v=6`);
            if(r.ok) { blk.tr = await r.json(); buildPointIndex(blk.tr, blk.trIndex); }
        } catch(e){}
    }

    if(serial !== refreshSerial) return;

    const showSP = document.getElementById('spOn').checked;
    const showTR = document.getElementById('trOn').checked;
    const b = map.getBounds();

    if(showSP && blk.spIndex) {
        drawVisibleFeatures(visibleFeatures(blk.spIndex), true, serial, b);
        spL.addTo(map);
    } else map.removeLayer(spL);

    if(showTR && blk.trIndex) {
        drawVisibleFeatures(visibleFeatures(blk.trIndex), false, serial, b);
        trL.addTo(map);
    } else map.removeLayer(trL);

    if(map.getZoom() >= LABEL_MIN_ZOOM){
        if(showSP) spLabels.addTo(map); else map.removeLayer(spLabels);
        if(showTR) trLabels.addTo(map); else map.removeLayer(trLabels);
    } else {
        map.removeLayer(spLabels); map.removeLayer(trLabels);
    }

    updateStatus();
}

function visibleFeatures(index){
    const b = map.getBounds();
    const x0 = Math.floor(b.getWest() / GRID_DEG) - 1, x1 = Math.floor(b.getEast() / GRID_DEG) + 1;
    const y0 = Math.floor(b.getSouth() / GRID_DEG) - 1, y1 = Math.floor(b.getNorth() / GRID_DEG) + 1;
    const out = [];

    for(let x=x0; x<=x1; x++){
        for(let y=y0; y<=y1; y++){
            const arr = index.get(`${x}/${y}`);
            if(arr) out.push(...arr);
        }
    }
    return out;
}

function drawVisibleFeatures(features, isSP, serial, b){
    const pointLayer = isSP ? spL : trL;
    const labelLayer = isSP ? spLabels : trLabels;
    const showLabels = map.getZoom() >= LABEL_MIN_ZOOM;

    for(const f of features){
        if(serial !== refreshSerial) return;
        const [lng, lat] = f.geometry.coordinates || [];
        if(!b.contains([Number(lat), Number(lng)])) continue;

        const p = f.properties || {};
        const color = isSP ? 'red' : '#06f';

        const m = L.circleMarker([Number(lat), Number(lng)], {
            pane:'pointPane', radius: isSP ? 3 : 2.5,
            color: color, fillColor: color, fillOpacity: 1, weight: .6
        });

        m.bindPopup(attributePopup(isSP, p, Number(lat), Number(lng)), { maxWidth: 380 });
        m.addTo(pointLayer);

        if(showLabels){
            const line = String(p.Line ?? p.LINE ?? p.line ?? '');
            const num = isSP ? (p.Sp ?? p.SP ?? p.sp) : (p.Tr ?? p.TR ?? p.tr ?? p.Tras ?? p.TRAS);
            let formattedNum = (isSP && num !== null && !isNaN(Number(num))) ? Number(num).toFixed(1) : num;

            const labelText = isSP ? `${esc(line)} SP ${esc(String(formattedNum ?? ''))}` : `${esc(line)} TRAS ${esc(String(num ?? ''))}`;
            const rotation = isOddLine(line) ? 90 : 0;

            const icon = L.divIcon({
                className:'',
                html:`<div class="point-label ${isSP ? 'spLabel' : 'trLabel'}" style="transform:rotate(${rotation}deg);transform-origin:top left;">${labelText}</div>`,
                iconSize:null, iconAnchor:[0,0]
            });

            L.marker([Number(lat), Number(lng)], { pane:'labelPane', icon:icon, interactive:false }).addTo(labelLayer);
        }
    }
}

/* =========================================================
   UTILITIES & LABELS
========================================================= */
function linePopup(feature, layer){
    const p = feature.properties || {};
    let h = '<b>📏 LINE</b><table class="at">';
    Object.keys(p).forEach(k => { h += `<tr><td>${esc(k)}</td><td>${esc(String(p[k] ?? ''))}</td></tr>`; });
    h += '</table>';
    layer.bindPopup(h, { maxWidth: 360 });
}

function attributePopup(isSP, p, lat, lng){
    let h = `<b>${isSP ? '🔴 SP' : '🔵 TRAS'}</b><table class="at">`;
    Object.keys(p).forEach(k => { h += `<tr><td>${esc(k)}</td><td>${esc(String(p[k] ?? ''))}</td></tr>`; });
    h += `<tr><td>Latitude</td><td>${lat.toFixed(7)}</td></tr><tr><td>Longitude</td><td>${lng.toFixed(7)}</td></tr></table>`;
    return h;
}

function clearPointLayers(){
    spL.clearLayers(); trL.clearLayers();
    spLabels.clearLayers(); trLabels.clearLayers();
}

function toggleLines(){
    if (!activeBlock) return;
    loadBlockData(activeBlock);
}

async function loadPer100Labels(){
    try{
        const rOdd = await fetch('Label_per_100_line_ganjil.geojson?v=5');
        if(rOdd.ok) drawPer100Labels(await rOdd.json(), per100OddLabels);
        const rEven = await fetch('Label_per_100_line_genap.geojson?v=5');
        if(rEven.ok) drawPer100Labels(await rEven.json(), per100EvenLabels);
    }catch(e){}
    updatePer100Labels();
}

function drawPer100Labels(data, layerGroup){
    layerGroup.clearLayers();
    (data.features || []).forEach(f => {
        const [lng, lat] = f.geometry?.coordinates || [];
        const tras = f.properties?.TRAS ?? f.properties?.Tras ?? '';
        if(!tras) return;

        const rotation = (layerGroup === per100OddLabels) ? 90 : 0;
        const icon = L.divIcon({
            className:'',
            html:`<div class="per100-label" style="transform:rotate(${rotation}deg); transform-origin:top left;">${esc(String(tras))}</div>`,
            iconSize:null, iconAnchor:[0,0]
        });

        L.marker([lat, lng], { pane:'labelPane', icon:icon, interactive:false }).addTo(layerGroup);
    });
}

function updatePer100Labels(){
    if (!activeBlock) return;
    const z = map.getZoom();
    const lblOn = document.getElementById('lblOn')?.checked;

    if(z >= 17 || !lblOn){
        map.removeLayer(per100OddLabels);
        map.removeLayer(per100EvenLabels);
        return;
    }
    per100OddLabels.addTo(map);
    per100EvenLabels.addTo(map);
}

function updateReceiverLabels(){
    if(!receiverLabels || !activeBlock) return;
    receiverLabels.clearLayers();

    if(!document.getElementById('recOn').checked || map.getZoom() > RECEIVER_LABEL_MAX_ZOOM){
        map.removeLayer(receiverLabels);
        return;
    }

    recGroup.eachLayer(group => {
        group.eachLayer(layer => {
            const p = layer.feature?.properties || {};
            const name = p.Line || p.LINE || p.Line_Name || '';
            if(!name) return;

            const pos = layer.getBounds().getCenter();
            const icon = L.divIcon({
                className:'', html:`<div class="receiver-label">${esc(name)}</div>`,
                iconSize:null, iconAnchor:[0,6]
            });
            L.marker(pos, { pane:'receiverLabelPane', icon:icon, interactive:false }).addTo(receiverLabels);
        });
    });

    receiverLabels.addTo(map);
}

function loadHazard(key){
    const cfg = hazardConfig[key];
    const layer = hazardLayers[key];
    if(!cfg || !layer || layer._loaded) return Promise.resolve();

    return fetch(cfg.file + '?v=1')
    .then(r => r.json())
    .then(data => {
        L.geoJSON(data, {
            pane:'hazardPane',
            style: { color:'#ff6600', weight:3, opacity:.9, fillColor:'#ffcc00', fillOpacity:.25 },
            onEachFeature: (feature, lyr) => {
                let h = `<b>⚠️ ${esc(cfg.name)}</b><table class="at">`;
                Object.keys(feature.properties || {}).forEach(k => { h += `<tr><td>${esc(k)}</td><td>${esc(String(feature.properties[k] ?? ''))}</td></tr>`; });
                h += '</table>';
                lyr.bindPopup(h, { maxWidth:380 });
            }
        }).addTo(layer);
        layer._loaded = true;
    });
}

function toggleHazard(key){
    const layer = hazardLayers[key];
    const cb = document.getElementById(hazardConfig[key].checkbox);
    if(cb.checked) loadHazard(key).then(() => layer.addTo(map));
    else map.removeLayer(layer);
}

function base(k){
    [sat, road, street, topo, hyb].forEach(x => map.hasLayer(x) && map.removeLayer(x));
    ({sat, road, street, topo, hyb}[k]).addTo(map);
}

function isOddLine(line){
    const m = String(line).match(/(\d+)\s*$/);
    return m ? (parseInt(m[1], 10) % 2 === 1) : false;
}

function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function updateStatus(){
    const z = map.getZoom();
    const el = document.getElementById('statusText');
    if(!activeBlock) { el.textContent = 'Silakan pilih blok'; return; }

    if(z < POINT_MIN_ZOOM) el.textContent = `Zoom ${z} — Zoom in untuk titik SP/TRAS`;
    else if(z < LABEL_MIN_ZOOM) el.textContent = `Zoom ${z} — Titik aktif, label muncul di Zoom ${LABEL_MIN_ZOOM}`;
    else el.textContent = `Zoom ${z} — SP/TRAS aktif`;
}

function locate(){
    if(!navigator.geolocation) return alert('GPS tidak didukung.');
    navigator.geolocation.getCurrentPosition(p => {
        const lat = p.coords.latitude, lng = p.coords.longitude;
        if(myLocationMarker) map.removeLayer(myLocationMarker);

        const redIcon = L.divIcon({ className:'', html:'<div class="red-location-icon">📍</div>', iconSize:[30,30], iconAnchor:[15,30] });
        myLocationMarker = L.marker([lat, lng], { icon: redIcon }).addTo(map).bindPopup(`<b>📍 Lokasi Saya</b><br>Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}`).openPopup();
        map.setView([lat, lng], 18);
    }, () => alert('Gagal mengakses lokasi.'), { enableHighAccuracy:true });
}

/* =========================================================
   START
========================================================= */
init();
</script>
