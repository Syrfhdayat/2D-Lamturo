<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta WebGIS</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Inisialisasi Peta
    const map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Fungsi fetch GeoJSON
    function loadGeoJSON(filePath, style) {
      return fetch(filePath)
        .then(res => res.json())
        .then(data => {
          return L.geoJSON(data, {
            style: style,
            onEachFeature: function (feature, layer) {
              if (feature.properties) {
                layer.bindPopup(JSON.stringify(feature.properties));
              }
            }
          });
        })
        .catch(err => console.error('Error loading ' + filePath, err));
    }

    // Daftar 8 file GeoJSON
    const files = [
      'central_receiver_line.geojson',
      'central_source_line.geojson',
      'central_sp.geojson',
      'central_tras.geojson',
      'west_receiver_line.geojson',
      'west_source_line.geojson',
      'west_sp.geojson',
      'west_tras.geojson'
    ];

    const overlayMaps = {};
    let loadedCount = 0;

    // Loop untuk memuat dan nampilin semua file
    files.forEach(fileName => {
      loadGeoJSON('./' + fileName).then(layer => {
        if (layer) {
          layer.addTo(map);
          overlayMaps[fileName] = layer;
        }
        
        loadedCount++;
        if (loadedCount === files.length) {
          L.control.layers(null, overlayMaps).addTo(map);
        }
      });
    });
  </script>
</body>
</html>
